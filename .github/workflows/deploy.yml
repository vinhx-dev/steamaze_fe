name: Build & Deploy frontend

# Push lên main: build image -> đẩy lên GHCR -> SSH vào server cập nhật container frontend.
# Cần secrets: SERVER_HOST, SSH_PRIVATE_KEY (tuỳ chọn: SERVER_PORT, SERVER_USER)
# Cần variable: SITE_URL (vd https://steamaze.com), được ghi vào bản build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra biến SITE_URL
        run: |
          if [ -z "${{ vars.SITE_URL }}" ]; then
            echo "::error::Chưa khai báo variable SITE_URL (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            BACKEND_INTERNAL_URL=http://backend:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/steamaze
            ./manage.sh deploy frontend
